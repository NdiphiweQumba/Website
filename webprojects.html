<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Web Projects</title>
    <meta name="description" content="Web Projects Portfolio">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-white">
    <div class="container py-5">
        <h1 class="text-center mb-4">Web Projects</h1>
        <div class="row">
            <div class="col-md-6 col-lg-4 mb-4">
                <div class="card bg-secondary text-white">
                    <!-- Carousel for slideshow -->
                    <div id="carouselExampleControls" class="carousel slide" data-bs-ride="carousel">
                        <div class="carousel-inner">
                            <div class="carousel-item active">
                                <img src="/web/Websites/GrowthMain.png" class="d-block w-100" alt="Growth Organization Website">
                            </div>
                            <!-- You can add more images here -->
                            <div class="carousel-item">
                                <img src="/web/Websites/GrowthMainResponsive.png" class="d-block w-100" alt="Growth Organization Additional Image">
                            </div>
                        </div>
                        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="prev">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Previous</span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="next">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Next</span>
                        </button>
                    </div>
                    <div class="card-body">
                        <h5 class="card-title">Growth Organization</h5>
                        <p class="card-text">Website made with HTML, CSS, Bootstrap, JavaScript, PHP.</p>
                        <a href="https://growthorganization.co.za/" target="_blank" class="btn btn-primary">Visit Website</a>
                    </div>
                </div>
            </div>
            <!-- Add more projects here -->
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
